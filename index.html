<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI产业日报</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <span class="logo-icon">🤖</span>
                <h1>AI产业日报</h1>
            </div>
            <div class="date-display">
                <span id="current-date"></span>
                <span class="badge">每日更新</span>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <div class="hero-content">
                <h2>聚焦全球AI动态</h2>
                <p>每日精选AI行业要闻，洞悉科技发展趋势</p>
            </div>
        </section>

        <section class="stats-bar">
            <div class="stat-item">
                <span class="stat-number" id="news-count">-</span>
                <span class="stat-label">今日新闻</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="last-update">-</span>
                <span class="stat-label">最后更新</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="data-source">-</span>
                <span class="stat-label">数据来源</span>
            </div>
        </section>

        <section class="news-section">
            <h3 class="section-title">
                <span class="title-icon">📰</span>
                今日要闻
            </h3>
            <div id="news-container" class="news-grid">
                <div class="loading">加载中...</div>
            </div>
        </section>

        <section class="sources-section">
            <h3 class="section-title">
                <span class="title-icon">📡</span>
                数据来源
            </h3>
            <div class="sources-grid">
                <div class="source-card">
                    <span class="source-icon">𝕏</span>
                    <span>X/Twitter</span>
                </div>
                <div class="source-card">
                    <span class="source-icon">📊</span>
                    <span>创业邦</span>
                </div>
                <div class="source-card">
                    <span class="source-icon">🔍</span>
                    <span>网络搜索</span>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>🤖 AI产业日报 · 每日自动更新</p>
            <p class="footer-note">数据来源：X(Twitter)、创业邦、网络搜索 | 更新时间：马德里时间 23:30</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
